name: Recover sub5

on:
  push:
    branches:
      - recover-sub5

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fix encoded input padding
        run: printf '=' >> input_parts/part_017.txt
      - name: Translate SRT
        env:
          MAX_WORKERS: '8'
        run: python translate.py
      - name: Upload translated SRT
        uses: actions/upload-artifact@v4
        with:
          name: sub5-recovered
          path: |
            output/sub_5(20260901-212054).srt
            output/chinese_left.json
          if-no-files-found: error
