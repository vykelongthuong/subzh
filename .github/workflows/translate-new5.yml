name: Translate new file 5

on:
  push:
    branches:
      - translate-5-20260902

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        run: |
          mkdir -p input
          cat new5_parts/part_*.txt | base64 -d | gzip -d > input/5.srt
          echo "0616cd5137ba9db598e5a9d04afbf9f48f92ccf33a36eb67f41a84ef83030b31  input/5.srt" | sha256sum -c -
      - name: Set output filename
        run: sed -i 's/sub_5(20260901-212054).srt/sub_5(20260902-065357).srt/' translate.py
      - name: Translate
        env:
          MAX_WORKERS: '16'
        run: python translate.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: sub5-20260902
          path: |
            output/sub_5(20260902-065357).srt
            output/chinese_left.json
          if-no-files-found: error
